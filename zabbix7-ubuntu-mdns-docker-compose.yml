version: "3.8"

services:
  postgres-server:
    image: postgres:latest
    container_name: zabbix-postgres-server
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=saltzabbix80time
      - POSTGRES_DB=zabbix
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    networks:
      - ubuntu-zabbix-net
    restart: unless-stopped

  zabbix-server-pgsql:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server-pgsql
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=saltzabbix80time
      - POSTGRES_DB=zabbix
    networks:
      - ubuntu-zabbix-net
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
    restart: unless-stopped

  zabbix-web-nginx-pgsql:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web-nginx-pgsql
    environment:
      - ZBX_SERVER_HOST=zabbix-server-pgsql
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=saltzabbix80time
      - POSTGRES_DB=zabbix
    networks:
      - ubuntu-zabbix-net
    ports:
      - "88:8080"
      - "443:8443"
    depends_on:
      - zabbix-server-pgsql
    restart: unless-stopped

networks:
  ubuntu-zabbix-net:
    driver: bridge

volumes:
  zabbix_postgres_data:
    driver: local
